<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Melody Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="img/logo.png.png" alt="Logo Melody Store">
        <span>Melody Store</span>
      </a>
    </div>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <nav id="menu-principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="instrumentos.html">Instrumentos</a></li>
        <li><a href="accesorios.html">Accesorios</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="contacto">
      <h2>Contacto</h2>
      <p>¿Tienes dudas sobre algún instrumento o quieres hacer un pedido especial? Escríbenos.</p>

      <form action="#" method="post" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 3001234567">

        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" name="asunto" placeholder="¿Sobre qué quieres hablar?">

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Melody Store &mdash; Instrumentos musicales para cada etapa de tu camino.</p>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
